# Ephemeral tmpfs Postgres for the isolated test run (scripts/run-tests-isolated.sh).
# Bound to 127.0.0.1 on a non-default port; data is tmpfs so nothing survives teardown.
name: ${APP_IMAGE_PREFIX:-afsmultipixel}-test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: ${APP_IMAGE_PREFIX:-afsmultipixel}-postgres-test
    environment:
      POSTGRES_USER: ${DB_USER:-afsmultipixel_test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-test123}
      POSTGRES_DB: ${DB_NAME:-afsmultipixel_test}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-afsmultipixel_test} -d ${DB_NAME:-afsmultipixel_test}"]
      interval: 2s
      timeout: 3s
      retries: 30
