[pytest]
# Test pyramid markers (Phase 4 wires the full harness + ephemeral Postgres):
#   unit        - pure logic, no external services
#   integration - needs Postgres
#   flow        - full business flow with mocked external services
#   e2e         - full docker stack
markers =
    unit: no external services
    integration: needs Postgres
    flow: full business flow with mocked externals
    e2e: full docker stack

filterwarnings =
    ignore::DeprecationWarning
testpaths = tests
