# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "48c50a3bda2b87c3891348c4bb58da79"
name = "AFS Multi Pixel"
application_url = "https://multi-pixel-test-app.adfeedstudio.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_markets,write_pixels,read_customer_events,read_orders"

[auth]
redirect_urls = [
  "https://multi-pixel-test-app.adfeedstudio.com/auth/callback",
  "https://multi-pixel-test-app.adfeedstudio.com/auth/shopify/callback",
  "https://multi-pixel-test-app.adfeedstudio.com/api/auth/callback"
]

[build]

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Server half of Purchase for the Conversions API. Handled by: /app/routes/webhooks.orders.create.tsx
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"
