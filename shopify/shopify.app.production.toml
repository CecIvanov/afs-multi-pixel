# PRODUCTION — a SEPARATE Shopify app (own client_id, URL, database, backend stack).
# Link it: cd shopify && npm run config:link:production
# Deploy:  npm run deploy:production
#
# Keep [access_scopes] and [webhooks] identical to shopify.app.toml — Shopify reads
# each toml standalone, so scope/webhook changes must be mirrored across all envs.

client_id = "4e22a50fb4b433f72347339801cf7e3f"
name = "AFS Multi Pixel"
handle = "afs-multi-pixel"
application_url = "https://multi-pixel-prd.adfeedstudio.com/app"
embedded = true

[access_scopes]
scopes = "read_markets,write_pixels,read_customer_events,read_orders"

[auth]
redirect_urls = [ "https://multi-pixel-prd.adfeedstudio.com/auth/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"


  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

  # Domain topics: the Purchase join (#9) and the Market re-fetch (#4).
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = ["markets/create"]
  uri = "/webhooks/markets/create"

  [[webhooks.subscriptions]]
  topics = ["markets/update"]
  uri = "/webhooks/markets/update"

  [[webhooks.subscriptions]]
  topics = ["markets/delete"]
  uri = "/webhooks/markets/delete"

[build]
automatically_update_urls_on_dev = false
